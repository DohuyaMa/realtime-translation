# Real-Time Translator: edge configuration (~/.config/real-time-translator/config.yml)
# Precedence: RT_EDGE_* environment > this file > defaults.

services:
  mode: auto                    # auto | transcribe | translate (auto: translate iff llm and tts sources exist)
  # Service discovery: Django lists the llm workers / rt-asr / rt-tts and their tokens
  django_urls: []               # own host first, e.g. ["http://127.0.0.1:8000", "http://cyborg:8000"]
  django_token_file: null       # user DRF token file (never the token itself)
  allowed_services: null        # ["llm:cyborg", "tts:sktop", ...] (kind:node, own node too); null = all discovered
  use:                          # which instance serves each kind: null/auto = local first + failover;
    llm: null                   #   a node name = only that node (no failover; down = explicit error)
    asr: null
    tts: null
    vosk: null                  #   vosk: also "off" = no cross-check, whisper-only translation
  # Services on this host, always tried first. A discovered service of this
  # host is reached here, or at 127.0.0.1:<its port> when null - never via
  # the cluster (tailscale) URL Django lists for it.
  local:
    node: null                  # this host's node name in discovery; null = hostname (case-insensitive)
    llm: null                   # e.g. "http://127.0.0.1:8080"
    asr: "http://127.0.0.1:8091"
    tts: null                   # e.g. "http://127.0.0.1:8093"
    vosk: null                  # e.g. "http://127.0.0.1:8092" (rt-vosk: cross-checks whisper in translate mode)
  local_token_file: /run/llama/local-token   # local worker token when Django is unreachable
  source_language: auto         # auto | pl | uk | ru | en
  # «Записувати сесію для аналізу» (env RT_EDGE_RECORD_SESSION): every translate-mode
  # segment's WAV + per-phrase JSONL (whisper, Vosk + conf, gate, translation) in
  # ~/.local/state/real-time-translator/sessions/<timestamp>/ for offline replay
  record_session: false
  timeouts:
    connect_s: 3
    asr_s: 30
    tts_s: 30
  asr:
    # Whisper prompt template (vocabulary/names/style), optional {{source_lang}};
    # rt-asr's stream appends the text it already committed. null/"" = none.
    prompt: null
  tts:
    voice: null                 # null = service default; list: GET /v1/audio/voices (UI: Озвучка)
    speed: null                 # 0.25..4.0; null = service default
  llm:
    session_ttl_s: 30           # worker app-session ttl (heartbeat every ttl/3), 6..300
    model: local
    max_tokens_cap: 512
    temperature: 0.1
    context_pairs: 3
    timeout_s: 15
    words_per_request: 40       # words per LLM call; longer text is split (sentence ends preferred)
    # Placeholders (double braces): {{text}} - the words of one request (required in
    # user_template), {{source_lang}}, {{target_lang}}. Old {lang}/{text} values are
    # rejected with a WARNING and the default template is used.
    system_prompt: ""           # "" = built-in interpreter prompt
    user_template: ""           # "" = "{{text}}"
    # Phrases Vosk also recognized (TASK-SYS-12): {{text}} = whisper, {{vosk_text}} =
    # Vosk (both required in check_user_template). "" = built-in (whisper = TEXT, translated
    # whole; Vosk = HINT, fixes misheard words: "TEXT: {{text}}\nHINT: {{vosk_text}}").
    check_system_prompt: ""
    check_user_template: ""
    # «Словник термінів»: {{terms}} of both system prompts ("Known terms (always
    # written in English): ..."). null = built-in IT list; "" = none; list or
    # "a, b" / one per line
    terms: null

audio:
  input_device: null            # PipeWire source the app records (null = default mic)
  output_device: null           # sink the translation is played into (null = default)
  monitor_enabled: false        # «Також чути в навушниках»
  monitor_device: null          # sink that also plays the translation (headphones)
  sample_rate: 16000
  chunk_size: 1024
  use_virtual_devices: true

ui:
  minimize_to_tray: false
  start_minimized: false
  show_vosk_text: true          # «Показувати текст Vosk» under each recognized phrase

logging:
  level: "INFO"
