# Real-Time Translator: edge configuration (~/.config/real-time-translator/config.yml)
# Precedence: RT_EDGE_* environment > this file > defaults.

services:
  mode: auto                    # auto | transcribe | translate (auto: translate iff llm and tts sources exist)
  # Service discovery: Django lists the llm workers / rt-asr / rt-tts and their tokens
  django_urls: []               # own host first, e.g. ["http://127.0.0.1:8000", "http://cyborg:8000"]
  django_token_file: null       # user DRF token file (never the token itself)
  allowed_services: null        # ["llm:cyborg", "tts:sktop", ...] (kind:node); null = all discovered
  # Services on this host, always tried first (null = none)
  local:
    llm: null                   # e.g. "http://127.0.0.1:8080"
    asr: "http://127.0.0.1:8091"
    tts: null                   # e.g. "http://127.0.0.1:8093"
  local_token_file: /run/llama/local-token   # local worker token when Django is unreachable
  source_language: auto         # auto | pl | uk | ru | en
  timeouts:
    connect_s: 3
    asr_s: 30
    tts_s: 30
  llm:
    session_ttl_s: 30           # worker app-session ttl (heartbeat every ttl/3), 6..300
    model: local
    max_tokens_cap: 512
    temperature: 0.1
    context_pairs: 3
    timeout_s: 15

segmentation:
  translate:                    # SegmenterConfig fields (phrase-sized segments)
    threshold: 0.5
    min_speech_ms: 400
    end_silence_ms: 700
    soft_max_ms: 8000
    soft_silence_ms: 250
    hard_max_ms: 20000
    lookback_ms: 1500
    preroll_ms: 300
  transcribe:                   # long chunks, chunk_max_s <= 900
    chunk_min_s: 300
    chunk_max_s: 600
    soft_silence_ms: 500
    lookback_ms: 5000
    keep_silence_ms: 2000

audio:
  sample_rate: 16000
  chunk_size: 1024
  use_virtual_devices: true

ui:
  minimize_to_tray: false
  start_minimized: false

logging:
  level: "INFO"
