# Real-Time Translator: edge configuration (~/.config/real-time-translator/config.yml)
# Precedence: RT_EDGE_* environment > this file > defaults.

services:
  mode: auto                    # auto | transcribe | translate (auto: translate iff LLM source and tts_urls set)
  asr_urls: ["http://127.0.0.1:8091"]   # rt-asr endpoints (least-pending pick)
  tts_urls: []                  # rt-tts endpoints (required for translate)
  api_token_file: null          # bearer token file for rt-* (never the token itself)
  source_language: auto         # auto | pl | uk | ru | en
  timeouts:
    connect_s: 3
    asr_s: 30
    tts_s: 30
  llm:
    # Lease mode (primary): Django hands out an llama worker
    django_urls: []
    django_token_file: null     # user DRF token file
    service: null               # preferred worker name; null = Django picks
    lease_ttl_s: 60             # 15..300
    # Dev mode (used when django_urls is empty): local llama-server / OpenAI-compatible
    direct_url: null            # e.g. "http://127.0.0.1:8080"
    direct_token_file: null
    model: local
    max_tokens_cap: 512
    temperature: 0.1
    context_pairs: 3
    timeout_s: 15

segmentation:
  translate:                    # SegmenterConfig fields (phrase-sized segments)
    threshold: 0.5
    min_speech_ms: 400
    end_silence_ms: 700
    soft_max_ms: 8000
    soft_silence_ms: 250
    hard_max_ms: 20000
    lookback_ms: 1500
    preroll_ms: 300
  transcribe:                   # long chunks, chunk_max_s <= 900
    chunk_min_s: 300
    chunk_max_s: 600
    soft_silence_ms: 500
    lookback_ms: 5000
    keep_silence_ms: 2000

audio:
  sample_rate: 16000
  chunk_size: 1024
  use_virtual_devices: true

ui:
  minimize_to_tray: false
  start_minimized: false

logging:
  level: "INFO"
