[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-translator"
version = "0.1.0"
description = "Real-time translation system with audio capture, processing, and playback"
authors = [
    {name = "DohuyaMa"}
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.scripts]
translator-ui               = "src.main:main"
rt-models                   = "src.services.common.models_cli:main"
rt-asr                      = "src.services.asr.__main__:main"
rt-tts                      = "src.services.tts.__main__:main"
rt-phonetic                 = "src.services.phonetic.__main__:main"
